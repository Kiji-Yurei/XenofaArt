name: Actualizar galería

# Se ejecuta cuando cambian imágenes en Arte/ o Cosplay/, o manualmente
on:
  push:
    paths:
      - 'Arte/**'
      - 'Cosplay/**'
      - 'Pelucas/**'
  workflow_dispatch:  # Permite ejecutar manualmente desde la pestaña Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para hacer push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar galeria.json
        run: node scripts/generar-galeria.js

      - name: Generar vistas previas (WebP ligeras)
        run: node scripts/generar-vistas-previas.js --force

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add galeria.json Arte/_preview Cosplay/_preview Pelucas/_preview
          if git diff --cached --quiet; then
            echo "Sin cambios en galería ni vistas previas"
          else
            git commit -m "chore: actualizar galería y vistas previas [skip ci]"
            git push
          fi
